name: Billing API smoke test

on: workflow_dispatch

permissions: {}

jobs:
  validate:
    if: github.repository == 'saulogatti/saulogatti' && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Validate read access without publishing usage
        shell: bash
        env:
          BILLING_READ_TOKEN: ${{ secrets.BILLING_READ_TOKEN }}
        run: |
          set +x
          set -o pipefail
          if [[ -z "${BILLING_READ_TOKEN:-}" ]]; then
            echo 'Missing BILLING_READ_TOKEN Actions secret.'
            exit 1
          fi

          base='https://api.github.com/users/saulogatti/settings/billing'
          for route in usage/summary ai_credit/usage; do
            if ! printf 'Authorization: Bearer %s\n' "$BILLING_READ_TOKEN" |
                curl -q --silent --fail --max-time 25 --header @- \
                  --header 'Accept: application/vnd.github+json' \
                  --header 'X-GitHub-Api-Version: 2026-03-10' \
                  "$base/$route" 2>/dev/null |
                jq -e '(.usageItems | type) == "array"' >/dev/null 2>&1; then
              echo "Billing API validation failed: $route."
              exit 1
            fi
            echo "Billing API request and response format OK: $route."
          done
